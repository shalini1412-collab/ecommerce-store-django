<!DOCTYPE html>
<html>

<head>
    <title>{{ product.name }}</title>

    <style>

        body{
            font-family: Arial;
            background:#f5f5f5;
            margin:40px;
        }

        .product-box{
            background:white;
            width:400px;
            margin:auto;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        img{
            width:100%;
            height:250px;
            object-fit:cover;
            border-radius:10px;
        }

        button{
            background:#007BFF;
            color:white;
            border:none;
            padding:12px;
            width:100%;
            border-radius:5px;
            cursor:pointer;
        }

    </style>

</head>


<body>

<div class="product-box">

<img src="{{ product.image }}">

<h1>{{ product.name }}</h1>

<h2>₹ {{ product.price }}</h2>

<p>{{ product.description }}</p>

<a href="/add-to-cart/{{ product.id }}/">

<button>
Add to Cart
</button>

</a>


</div>

</body>

</html>
